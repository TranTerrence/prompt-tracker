<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Harnais onboarding (dev)</title>
</head>
<body>
  <script>
    // Stub chrome.* minimal : l'onboarding ne dépend que du storage.
    (function () {
      const STALE = Number(new URLSearchParams(location.search).get("stale") || 0);
      const store = { settings: { theme: "light", threshold: 40, profile: "student" } };
      window.chrome = {
        storage: {
          local: {
            get(keys, cb) {
              const out = {};
              for (const k of Array.isArray(keys) ? keys : [keys]) if (k in store) out[k] = store[k];
              cb(out);
            },
            set(obj, cb) { Object.assign(store, obj); cb && cb(); },
            remove(_k, cb) { cb && cb(); },
          },
          onChanged: { addListener() {} },
        },
        runtime: { getURL: (p) => p, getManifest: () => ({ content_scripts: [{ matches: ["https://chatgpt.com/*"] }] }) },
        permissions: { request(_o, cb) { cb && cb(true); } },
        // Onglets IA « périmés » (ouverts avant l'installation) : ?stale=2 pour
        // voir l'invitation à recharger, sans paramètre pour l'écran normal.
        tabs: {
          create() {},
          query(_f, cb) { cb(Array.from({ length: STALE }, (_, i) => ({ id: i + 1 }))); },
          sendMessage(_id, _m, cb) {
            window.chrome.runtime.lastError = { message: "no receiver" };
            cb(undefined);
            window.chrome.runtime.lastError = undefined;
          },
          reload(_id, _o, cb) { cb && cb(); },
        },
        i18n: { getUILanguage: () => "fr" },
      };
    })();
  </script>
  <script>
    fetch("../onboarding/onboarding.html")
      .then((r) => r.text())
      .then((html) => {
        html = html.replace("<head>", "<head><base href='../onboarding/'>");
        document.open();
        document.write(html);
        document.close();
      });
  </script>
</body>
</html>
