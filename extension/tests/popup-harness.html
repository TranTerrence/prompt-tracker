<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Harnais popup (dev)</title>
</head>
<body>
  <script>
    // Stub chrome.* + jeu de données de démo (Léa, étudiante, 3 semaines).
    // La courbe raconte l'apprentissage : premiers jets faibles puis au niveau.
    (function () {
      const now = Date.now();
      const day = 864e5;
      const split = (total) => {
        const clarte = Math.min(25, Math.round(total * 0.38));
        const contexte = Math.min(25, Math.round(total * 0.3));
        const critique = Math.min(25, Math.max(0, total - clarte - contexte));
        return { clarte, contexte, iteration: 0, critique, total };
      };
      const cats = ["rédaction", "analyse", "recherche", "résumé", "code"];
      const events = [];
      let i = 0;
      const push = (d, opts) => {
        events.push(Object.assign({
          id: "demo-" + i,
          ts: new Date(now - d * day - ((i * 7) % 10) * 36e5).toISOString(),
          site: ["chatgpt", "claude", "gemini"][i % 3],
          category: cats[i % cats.length],
          words: 18 + (i % 25),
          intercepted: false,
          outcome: "sent",
          scoreBefore: null,
          scoreAfter: null,
          mirrorShown: false,
          mirrorFeedback: null,
          rounds: 0,
          answersCount: 0,
          synced: true,
        }, opts));
        i++;
      };
      // Semaine 1 : premiers jets faibles, beaucoup d'interceptions améliorées
      for (const [d, before, after] of [[20, 18, 58], [19, 24, 61], [18, 22, 55], [17, 29, 64], [16, 26, 60], [15, 31, 57]]) {
        push(d, { intercepted: true, outcome: "improved", scoreBefore: before, scoreAfter: after,
          scores: split(after), mirrorShown: true, rounds: 3, answersCount: 2 });
      }
      // Semaine 2 : transition
      for (const [d, before, after] of [[13, 33, 62], [12, 36, 66], [10, 38, 63]]) {
        push(d, { intercepted: true, outcome: "improved", scoreBefore: before, scoreAfter: after,
          scores: split(after), mirrorShown: true, rounds: 2, answersCount: 2 });
      }
      for (const [d, t] of [[13, 41], [11, 38], [9, 44], [8, 46]]) push(d, { scores: split(t) });
      // Semaine 3 : les premiers jets tiennent le seuil : la série se construit
      for (const [d, t] of [[6, 47], [6, 44], [5, 52], [4, 49], [3, 55], [2, 51], [1, 58], [0, 54], [0, 61]]) {
        push(d, { scores: split(t) });
      }
      push(2, { intercepted: true, outcome: "improved", scoreBefore: 42, scoreAfter: 68,
        scores: split(68), mirrorShown: true, rounds: 2, answersCount: 2 });

      const store = {
        settings: { theme: "light", threshold: 40, interceptEnabled: true, captureMode: "metadata", profile: "student" },
        // Divulgation acceptée : le popup montre l'état nominal (pas le bandeau de veille).
        disclosure: { accepted: true, version: 1, acceptedAt: new Date(now - 20 * day).toISOString() },
        events,
      };

      // ?pairing=waiting : demande d'appairage en cours. C'est l'état NOMINAL
      // à la réouverture du popup (il se ferme dès que l'onglet d'approbation
      // prend le focus), donc celui qu'il faut pouvoir regarder.
      if (new URLSearchParams(location.search).get("pairing") === "waiting") {
        store.pairing = {
          deviceCode: "d".repeat(48),
          userCode: "K7QM3XPA",
          expiresAt: new Date(now + 9 * 60000).toISOString(),
        };
      }

      // Scénarios de synchronisation bloquée : ?blocked=no_baseline_consent
      // (le blocage silencieux corrigé), no_org, not_authenticated, error.
      // Sans paramètre : état nominal, aucune bannière.
      const blocked = new URLSearchParams(location.search).get("blocked");
      if (blocked) {
        const stale = events.slice(-14).map((e) => ({ ...e, synced: false }));
        store.events = events.slice(0, -14).concat(stale);
        store.session = { email: "lea@lycee-jean-moulin.fr", user_id: "demo", expires_at: now + 36e5 };
        store.profile = { org_id: "demo-org", role: "member" };
        store.orgConfig = { orgId: "demo-org", branding: { name: "Lycée Jean-Moulin" }, dataRequests: {} };
        if (blocked === "no_org") { store.profile = null; store.orgConfig = null; }
        if (blocked === "not_authenticated") { store.session = null; store.profile = null; store.orgConfig = null; }
        store.syncStatus = {
          at: now,
          pending: stale.length,
          oldestPendingTs: stale[0].ts,
          reason: blocked === "error" ? null : blocked,
          error: blocked === "error" ? "rest_401: JWT expired" : null,
          pushed: 0,
          lastOkAt: null,
        };
      }
      // ?noscore=1 : organisation qui masque tout ce qui est chiffré.
      // ?library=1 : organisation qui publie une bibliothèque de prompts,
      //   permission d'hôte pas encore accordée (la carte d'activation).
      // ?library=granted : permission accordée, cache frais (la liste 0.9.0).
      // ?library=stale : permission accordée, cache de 7 h (rendu immédiat
      //   depuis le cache, puis re-rendu depuis la réponse du worker).
      // ?library=empty : permission accordée, aucun cache et le worker ne
      //   répond rien (chargement → « aucun prompt publié »).
      // ?tabs=2 : deux onglets IA ouverts AVANT l'installation (le content
      //   script n'y répond pas) → bandeau « recharger ces onglets ».
      const params = new URLSearchParams(location.search);
      const library = params.get("library");
      const STALE_TABS = Number(params.get("tabs") || 0);
      if (params.has("noscore") || library) {
        store.session = store.session || { email: "lea@lycee-jean-moulin.fr", user_id: "demo", expires_at: now + 36e5 };
        store.profile = store.profile || { org_id: "demo-org", role: "member" };
        store.orgConfig = {
          orgId: "demo-org",
          branding: { name: "Lycée Jean-Moulin" },
          dataRequests: {},
          showScore: !params.has("noscore"),
          libraryUrl: library ? "https://lycee-jean-moulin.fr/prompts.json" : null,
        };
      }
      if (library === "granted" || library === "stale") {
        store.promptLibrary = {
          url: "https://lycee-jean-moulin.fr/prompts.json",
          fetchedAt: library === "stale" ? now - 7 * 36e5 : now,
          prompts: [
            { id: "off-1", title: "Analyser un article scientifique", body: "Contexte : je suis étudiant en ingénierie. Voici l'article et ce que j'en ai compris : … Vérifie mon résumé et pose-moi trois questions sur ce que j'aurais raté.", kind: "official", category: "analyse", lang: "fr", copies: 41, helpful: 12, author: null },
            { id: "off-2", title: "Structure a literature review", body: "Context: I am writing a literature review on … Here is my draft outline: … Challenge the structure before improving the wording.", kind: "official", category: "recherche", lang: "en", copies: 18, helpful: 5, author: null },
            { id: "off-3", title: "Vérifier un calcul d'ordre de grandeur", body: "Voici mon estimation et chaque hypothèse chiffrée : … Attaque les hypothèses une par une avant de recalculer.", kind: "official", category: null, lang: "fr", copies: null, helpful: null, author: null },
            { id: "peer-1", title: "Plan de dissertation en 3 parties", body: "Je prépare une dissertation sur … Voici ma problématique et mon plan. Dis-moi où le plan ne répond pas à la problématique.", kind: "peer", category: "rédaction", lang: "fr", copies: 27, helpful: 9, author: null },
            { id: "peer-2", title: "Débugger sans la solution", body: "Voici mon code et l'erreur. Ne me donne pas la correction : pose-moi des questions jusqu'à ce que je la trouve.", kind: "peer", category: "code", lang: "fr", copies: 12, helpful: 4, author: null },
          ],
        };
      }

      // Le vrai chrome.permissions.request n'accepte de tourner QUE dans le
      // tick synchrone d'un geste utilisateur : un storage.get asynchrone
      // entre le clic et la demande faisait lever la vraie API alors que
      // l'ancien harnais (rappels synchrones, request toujours d'accord)
      // ne pouvait pas le voir. On rejoue la contrainte : fenêtre de geste
      // ouverte au clic, refermée au tick suivant. Le drapeau vit sur window
      // (les propriétés survivent au document.write plus bas, pas les
      // écouteurs : celui-ci est posé après le chargement du popup).
      window.__userGesture = false;
      window.__armGesture = () => {
        window.__userGesture = true;
        setTimeout(() => { window.__userGesture = false; }, 0);
      };

      // Comme la vraie API : une fois request accordé, contains dit oui.
      let hostGranted = ["granted", "stale", "empty"].includes(library);

      window.chrome = {
        permissions: {
          contains(_p, cb) { cb(hostGranted); },
          request(_p, cb) {
            if (!window.__userGesture) {
              throw new Error("permissions.request may only be called from a user input handler (harnais : geste perdu)");
            }
            hostGranted = true;
            cb(true);
          },
        },
        storage: {
          local: {
            get(keys, cb) {
              const out = {};
              for (const k of Array.isArray(keys) ? keys : [keys]) if (k in store) out[k] = store[k];
              // Asynchrone comme le vrai chrome.storage : les rappels
              // synchrones de l'ancien harnais masquaient la perte du geste
              // utilisateur (et n'importe quel bogue d'ordre d'exécution).
              setTimeout(() => cb(out), 0);
            },
            set(obj, cb) { Object.assign(store, obj); cb && cb(); },
            remove(_k, cb) { cb && cb(); },
          },
          onChanged: { addListener() {} },
        },
        runtime: {
          sendMessage(m, cb) {
            // Routage par type, comme le vrai worker : library-fetch répond
            // les prompts du cache (ou null), le reste un ok neutre.
            if (m && m.type === "library-fetch")
              return cb && cb({ prompts: store.promptLibrary ? store.promptLibrary.prompts : null });
            cb && cb({ ok: false });
          },
          getURL: (p) => p,
          getManifest: () => ({ content_scripts: [{ matches: ["https://chatgpt.com/*"] }] }),
          lastError: null,
        },
        // ?tabs=2 : deux onglets IA ouverts avant l'installation, qui ne
        // répondent pas au ping → bandeau « recharger ces onglets ». Sans le
        // paramètre, query ne renvoie rien et le bandeau reste masqué.
        tabs: {
          create() {},
          query(_f, cb) { cb(Array.from({ length: STALE_TABS }, (_, i) => ({ id: i + 1 }))); },
          sendMessage(_id, _m, cb) {
            window.chrome.runtime.lastError = { message: "no receiver" };
            cb(undefined);
            window.chrome.runtime.lastError = undefined;
          },
          reload(_id, _o, cb) { cb && cb(); },
        },
        i18n: { getUILanguage: () => "fr" },
      };
    })();
  </script>
  <script>
    // Charge le vrai popup avec ses chemins relatifs, présenté en carte centrée.
    fetch("../popup/popup.html")
      .then((r) => r.text())
      .then((html) => {
        html = html
          .replace("<head>", "<head><base href='../popup/'>")
          .replace("</head>", `<style>
            html { background: #e9e2d4; }
            body { margin: 48px auto; border-radius: 18px; border: 1px solid #d8cfc0;
                   box-shadow: 0 24px 60px rgba(27,24,21,.18); padding: 18px 16px; }
          </style></head>`);
        document.open();
        document.write(html);
        document.close();
        // document.open() a effacé les écouteurs : la fenêtre de geste se
        // pose maintenant, sur le document du popup.
        window.addEventListener("click", window.__armGesture, true);
      });
  </script>
</body>
</html>
