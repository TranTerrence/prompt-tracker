<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Prompt Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="fatal" class="fatal" hidden></div>
  <header>
    <div class="brand-row">
      <img id="brand-logo" src="../icons/icon48.png" alt="" width="24" height="24" />
      <h1 id="brand-title">Prompt Tracker</h1>
      <div class="theme-switch" role="radiogroup" aria-label="Thème">
        <button data-theme-choice="light" title="Clair">☀️</button>
        <button data-theme-choice="dark" title="Sombre">🌙</button>
        <button data-theme-choice="system" title="Système">◐</button>
      </div>
    </div>
    <p class="tagline" data-i18n="popupTagline"></p>
    <span id="health" class="health" hidden></span>
    <!-- Alerte DOUCE, distincte de la panne dure ci-dessus : les mesures de
         réponse sont indisponibles, mais le coaching fonctionne. -->
    <span id="health-metrics" class="health health-soft" hidden></span>
  </header>

  <!-- Extension en veille : la divulgation des données n'a pas encore été
       acceptée. Rien n'est capturé ; ce bandeau ramène à l'onboarding. -->
  <section id="inert-banner" class="inert" hidden>
    <p id="inert-text"></p>
    <button id="inert-cta"></button>
  </section>

  <!-- Nouveautés de la divulgation. NON BLOQUANT à dessein : les indicateurs
       ajoutés en 0.7 servent la même finalité et sont de la même nature (aucun
       contenu). Remettre les comptes existants en veille couperait des classes
       en cours d'année ; on informe, on ne redemande pas d'accord. -->
  <section id="disclosure-update" class="inert" hidden>
    <p id="disclosure-update-text"></p>
    <button id="disclosure-update-ok"></button>
  </section>

  <!-- Synchronisation bloquée : la raison est affichée avec l'action qui la
       lève. Une sync qui ne part pas ne doit jamais être silencieuse. -->
  <section id="sync-banner" class="sync-banner" hidden>
    <p id="sync-banner-text"></p>
    <p id="sync-banner-pending" class="muted" hidden></p>
    <button id="sync-banner-cta"></button>
  </section>

  <section id="auth" class="auth">
    <div id="auth-form">
      <!-- Chemin principal : appairage par le web. Aucun mot de passe saisi
           dans le popup, et une seule inscription à maintenir. -->
      <p id="pair-intro" class="auth-hint"></p>
      <div class="auth-buttons">
        <button id="pair-start"></button>
      </div>
      <div id="pair-waiting" class="join-disclosure" hidden>
        <h3 id="pair-code" class="pair-code"></h3>
        <p id="pair-waiting-text"></p>
        <div class="auth-buttons">
          <button id="pair-reopen" class="secondary"></button>
          <button id="pair-cancel" class="cancel"></button>
        </div>
      </div>
      <p id="pair-error" class="auth-error" hidden></p>

      <!-- Repli : connexion par mot de passe. Conservée pour permettre un test
           complet sans quitter l'extension (relecture Web Store notamment). -->
      <details id="auth-fallback">
        <summary id="auth-fallback-summary"></summary>
        <input type="email" id="auth-email" autocomplete="email" />
        <input type="password" id="auth-password" autocomplete="current-password" />
        <div class="auth-buttons">
          <button id="auth-login"></button>
          <button id="auth-signup" class="secondary"></button>
        </div>
        <p id="auth-error" class="auth-error" hidden></p>
        <p id="pending-signup" class="auth-hint" hidden></p>
        <p class="auth-hint" data-i18n="authHint"></p>
      </details>
    </div>
    <div id="auth-connected" hidden>
      <p><span id="auth-user"></span> · <span id="auth-org" class="muted"></span></p>
      <p id="sync-status" class="muted"></p>
      <div id="join-org" hidden>
        <input type="text" id="join-code" maxlength="10" autocomplete="off" spellcheck="false" />
        <div class="auth-buttons">
          <button id="join-submit"></button>
        </div>
        <!-- Divulgation avant la jonction : rejoindre une classe = partager les
             indicateurs listés. L'acte affirmatif est le bouton d'accord. -->
        <div id="join-disclosure" class="join-disclosure" hidden>
          <h3 id="join-disc-title"></h3>
          <p id="join-disc-body"></p>
          <div class="auth-buttons">
            <button id="join-disc-accept"></button>
            <button id="join-disc-cancel" class="cancel"></button>
          </div>
        </div>
        <p id="join-error" class="auth-error" hidden></p>
      </div>
      <div class="auth-buttons">
        <button id="open-dashboard"></button>
        <button id="auth-logout" class="secondary"></button>
      </div>
      <p class="auth-hint" data-i18n="authDashboardHint"></p>
      <button id="open-consent" class="secondary" hidden></button>
    </div>
  </section>

  <section class="stats">
    <div class="stat"><span class="value" id="stat-count">0</span><span class="label" data-i18n="popupPrompts"></span></div>
    <div class="stat"><span class="value" id="stat-score">–</span><span class="label" data-i18n="popupAvgScore"></span></div>
    <div class="stat"><span class="value" id="stat-trend">–</span><span class="label" data-i18n="popupTrend"></span></div>
    <div class="stat"><span class="value" id="stat-mirror">–</span><span class="label" data-i18n="popupMirror"></span></div>
  </section>

  <section>
    <h2 data-i18n="popupRubrics"></h2>
    <div id="rubrics"></div>
  </section>

  <section>
    <h2 data-i18n="popupCategories"></h2>
    <ul id="categories" class="categories"></ul>
  </section>

  <section class="settings">
    <h2 data-i18n="popupSettings"></h2>
    <label><input type="checkbox" id="setting-mirror" checked /> <span data-i18n="popupIntercept"></span></label>
    <label class="slider"><span data-i18n="popupThreshold"></span> <b id="threshold-value">40</b>/100
      <input type="range" id="setting-threshold" min="0" max="100" step="5" value="40" />
    </label>
    <p class="muted" id="eff-threshold" hidden></p>
    <label><input type="checkbox" id="setting-fulltext" /> <span data-i18n="popupFullText"></span></label>
  </section>

  <!-- Couverture des mesures de réponse : le signal qui chute quand un
       éditeur change son interface, avant qu'on s'en aperçoive autrement. -->
  <p class="muted" id="coverage" hidden></p>

  <footer>
    <button id="export"></button>
    <button id="reset" class="danger"></button>
  </footer>
  <p class="privacy-link"><a id="method-link" href="https://track-prompt.vercel.app/methode" target="_blank" rel="noreferrer"></a> · <a id="privacy-link" href="https://track-prompt.vercel.app/privacy" target="_blank" rel="noreferrer"></a></p>

  <script src="../src/i18n.js"></script>
  <script src="../src/scoring.js"></script>
  <script src="../src/supabase.js"></script>
  <script src="popup.js"></script>
</body>
</html>
